name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Tests + Evaluation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Standard library only; pytest is the single install.
        run: pip install pytest

      - name: Run pytest
        run: python3 -m pytest -v --tb=short

      - name: Run evaluation
        # Exits 1 if any check is below N/N.
        run: python3 evaluate.py
